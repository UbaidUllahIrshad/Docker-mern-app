version: '3.8'
services:
  frontend:
    image: ubaid393/mern-frontend:1.0
    container_name: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: ubaid393/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/mern-database?authSource=admin
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mern-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mern-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb

volumes:
  mongodb_data:
